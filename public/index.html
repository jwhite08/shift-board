<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shift Board — Gastro Associates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E141C;
    --surface: #171F29;
    --surface-2: #1D2733;
    --line: #2A3644;
    --text: #F2F6F9;
    --text-soft: #8D98A6;
    --text-faint: #5C6773;
    --blue: #2E8FE0;
    --blue-bright: #5DAAF5;
    --blue-soft: rgba(46, 143, 224, 0.16);
    --blue-border: rgba(46, 143, 224, 0.4);
    --cyan: #22B8CE;
    --cyan-soft: rgba(34, 184, 206, 0.16);
    --cyan-border: rgba(34, 184, 206, 0.4);
    --danger: #E5565B;
    --danger-soft: rgba(229, 86, 91, 0.14);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body {
    background: radial-gradient(1100px 550px at 50% -8%, #1B2733 0%, #0E141C 55%);
    min-height: 100vh;
  }

  h1, h2, h3 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    margin: 0;
  }

  button { font-family: inherit; }
  a { color: var(--blue-bright); }

  .topbar {
    background: rgba(23, 31, 41, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--blue-bright);
    text-shadow: 0 0 18px rgba(46, 143, 224, 0.35);
  }

  .brand span.tag {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 500;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-soft);
    flex-wrap: wrap;
  }

  /* Scoped to the arrow buttons only — a generic ".date-nav button" selector
     here would also resize/reshape the Today pill below. */
  .nav-arrow {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .nav-arrow:hover { background: var(--surface-2); border-color: var(--blue-border); }

  .date-label {
    font-weight: 600;
    color: var(--text);
    min-width: 150px;
    text-align: center;
    flex-shrink: 0;
  }

  .today-pill {
    border: 1px solid var(--blue-border);
    color: var(--blue-bright);
    background: var(--blue-soft);
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .today-pill:hover { background: var(--blue); color: #0E141C; }

  .shift-switch {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }

  .shift-switch button {
    border: none;
    background: transparent;
    padding: 7px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--text-soft);
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }

  .shift-switch button.active[data-val="AM"] { background: var(--blue); color: #0E141C; }
  .shift-switch button.active[data-val="PM"] { background: var(--cyan); color: #0E141C; }

  .you-bar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 20px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--line);
  }

  .you-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .staff-combo {
    position: relative;
    min-width: 220px;
  }

  .staff-combo input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .staff-combo input:focus { outline: none; border-color: var(--blue-border); }

  .staff-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 20;
  }
  .staff-dropdown.show { display: block; }

  .staff-option {
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .staff-option:hover, .staff-option.highlighted {
    background: var(--blue-soft);
    color: var(--blue-bright);
  }

  .staff-dropdown .no-match {
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--text-faint);
    font-style: italic;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 18px;
    border-radius: 2px;
    background: var(--blue);
    display: inline-block;
    flex-shrink: 0;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    align-items: start;
  }

  .loc-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .loc-card:hover { border-color: var(--blue-border); }

  .loc-card-head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
  }
  .loc-card-head:hover { background: rgba(255, 255, 255, 0.03); }

  .loc-name { font-size: 15px; font-weight: 700; color: var(--text); }

  .loc-meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .fill-pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-soft);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
  }

  .chevron { color: var(--text-soft); font-size: 13px; width: 14px; text-align: center; }

  .ws-list { padding: 10px 16px 14px; border-top: 1px solid var(--line); }

  .ws-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
  }
  .ws-row:last-child { border-bottom: none; }

  .ws-meta { min-width: 0; }

  .ws-label { font-size: 12px; color: var(--text-soft); font-weight: 500; }

  .ws-person {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ws-person.empty { color: var(--text-faint); font-weight: 500; font-style: italic; }
  .you-tag { color: var(--cyan); font-weight: 700; margin-left: 4px; }

  .ws-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .ext-tag {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: var(--blue-soft);
    color: var(--blue-bright);
    border: 1px solid var(--blue-border);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .ext-tag::before {
    content: "EXT";
    font-size: 8px;
    opacity: 0.65;
    margin-right: 5px;
    letter-spacing: 0.08em;
  }

  .chip-btn {
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: 0.15s;
    flex-shrink: 0;
  }
  .chip-btn.signin { background: var(--blue-soft); border-color: var(--blue-border); color: var(--blue-bright); }
  .chip-btn.signin:hover { background: var(--blue); color: #0E141C; }
  .chip-btn.takeover { background: transparent; border-color: var(--line); color: var(--text-soft); }
  .chip-btn.takeover:hover { border-color: var(--danger); color: var(--danger); }
  .chip-btn.leave { background: var(--cyan-soft); border-color: var(--cyan-border); color: var(--cyan); }
  .chip-btn.leave:hover { background: var(--cyan); color: #0E141C; }

  select {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    color: var(--text-soft);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .empty-state a { font-weight: 600; }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 24px;
  }

  .toast {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .toast.show { display: block; }
  .toast.ok { background: var(--surface-2); color: var(--blue-bright); border: 1px solid var(--blue-border); }
  .toast.err { background: var(--surface-2); color: var(--danger); border: 1px solid rgba(229,86,91,0.4); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Shift Board</h1>
      <span class="tag">Gastro Associates</span>
    </div>
    <div class="date-nav">
      <button id="prevDay" class="nav-arrow" title="Previous day">‹</button>
      <span class="date-label" id="dateLabel">—</span>
      <button id="nextDay" class="nav-arrow" title="Next day">›</button>
      <button class="today-pill" id="todayBtn">Today</button>
    </div>
    <div class="shift-switch" id="viewShiftSwitch">
      <button data-val="AM" class="active">AM</button>
      <button data-val="PM">PM</button>
    </div>
  </div>
  <div class="you-bar-inner">
    <label class="you-label" for="staffInput">Signed in as</label>
    <div class="staff-combo">
      <input type="text" id="staffInput" placeholder="Type your name…" autocomplete="off" />
      <div class="staff-dropdown" id="staffDropdown"></div>
    </div>
  </div>
</div>

<main>
  <div class="section-title" id="boardTitle">AM shift — who's where</div>
  <div class="board-grid" id="board">
    <div class="empty-state">Loading board…</div>
  </div>
  <div class="footer-note">Tap a location to expand it and sign in to a workstation. Locations, extensions, and staff are managed from the <a href="/admin.html">admin page</a>.</div>
</main>

<div class="toast" id="toast"></div>

<script>
const API_CONFIG = "/api/config";
const API_SCHEDULE = "/api/schedule";
const REFRESH_MS = 30000;
const LAST_STAFF_KEY = "shiftboard:lastStaffId";

let config = { locations: [], staff: [] };
let schedule = { AM: {}, PM: {} };
let viewDate = todayStr();
let viewShift = (new Date().getHours() < 12) ? "AM" : "PM";
let currentStaffId = "";
let expandedLocations = new Set();
let staffFiltered = [];
let staffHighlightIndex = -1;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const opts = { weekday: "short", month: "short", day: "numeric" };
  const label = d.toLocaleDateString(undefined, opts);
  return dateStr === todayStr() ? label + " (today)" : label;
}

async function loadConfig() {
  const res = await fetch(API_CONFIG);
  config = await res.json();
  initStaffField();
}

async function loadSchedule() {
  const res = await fetch(`${API_SCHEDULE}?date=${viewDate}`);
  schedule = await res.json();
  renderBoard();
}

function getStaffName(id) {
  const s = config.staff.find(s => s.id === id);
  return s ? s.name : "";
}

function computeStaffFiltered(query) {
  const q = query.trim().toLowerCase();
  const sorted = [...config.staff].sort((a, b) => a.name.localeCompare(b.name));
  if (!q) return sorted;
  return sorted.filter(s => s.name.toLowerCase().includes(q));
}

function renderStaffDropdown() {
  const dd = document.getElementById("staffDropdown");
  if (!staffFiltered.length) {
    dd.innerHTML = `<div class="no-match">No matching staff</div>`;
    return;
  }
  dd.innerHTML = staffFiltered.map((s, i) => `
    <div class="staff-option ${i === staffHighlightIndex ? "highlighted" : ""}" data-staff-id="${s.id}">${escapeHtml(s.name)}</div>
  `).join("");
}

function showStaffDropdown() {
  staffFiltered = computeStaffFiltered(document.getElementById("staffInput").value);
  staffHighlightIndex = staffFiltered.findIndex(s => s.id === currentStaffId);
  renderStaffDropdown();
  document.getElementById("staffDropdown").classList.add("show");
}

function hideStaffDropdown() {
  document.getElementById("staffDropdown").classList.remove("show");
  staffHighlightIndex = -1;
}

function commitStaffSelection(staffId) {
  currentStaffId = staffId;
  document.getElementById("staffInput").value = getStaffName(staffId);
  if (staffId) localStorage.setItem(LAST_STAFF_KEY, staffId);
  else localStorage.removeItem(LAST_STAFF_KEY);
  hideStaffDropdown();
  renderBoard();
}

function revertStaffInput() {
  document.getElementById("staffInput").value = currentStaffId ? getStaffName(currentStaffId) : "";
}

function initStaffField() {
  const last = localStorage.getItem(LAST_STAFF_KEY);
  if (last && config.staff.some(s => s.id === last)) {
    currentStaffId = last;
    document.getElementById("staffInput").value = getStaffName(last);
  }
}

function renderBoard() {
  const board = document.getElementById("board");
  document.getElementById("boardTitle").textContent = `${viewShift} shift — who's where`;

  if (!config.locations.length) {
    board.innerHTML = `<div class="empty-state">No locations have been set up yet. Add them from the <a href="/admin.html">admin page</a>.</div>`;
    return;
  }

  const shiftAssignments = schedule[viewShift] || {};
  const staffById = Object.fromEntries(config.staff.map(s => [s.id, s.name]));
  const wsOccupant = {}; // workstationId -> staffId
  for (const [staffId, assign] of Object.entries(shiftAssignments)) {
    if (assign.workstationId) wsOccupant[assign.workstationId] = staffId;
  }

  board.innerHTML = config.locations.map(loc => {
    const isExpanded = expandedLocations.has(loc.id);
    const filled = loc.workstations.filter(ws => wsOccupant[ws.id]).length;

    return `
      <div class="loc-card" data-loc-id="${loc.id}">
        <button class="loc-card-head" data-action="toggle-loc">
          <span class="loc-name">${escapeHtml(loc.name)}</span>
          <span class="loc-meta">
            <span class="fill-pill">${filled}/${loc.workstations.length}</span>
            <span class="chevron">${isExpanded ? "▾" : "▸"}</span>
          </span>
        </button>
        ${isExpanded ? `
          <div class="ws-list">
            ${loc.workstations.map(ws => {
              const occupantId = wsOccupant[ws.id];
              const occupantName = occupantId ? (staffById[occupantId] || "Unknown staff") : null;
              const isMe = occupantId && occupantId === currentStaffId;

              let actionBtn;
              if (isMe) {
                actionBtn = `<button class="chip-btn leave" data-action="leave">Leave</button>`;
              } else if (occupantName) {
                actionBtn = `<button class="chip-btn takeover" data-action="sign-in" data-loc-id="${loc.id}" data-ws-id="${ws.id}" data-occupant="${escapeHtml(occupantName)}">Take over</button>`;
              } else {
                actionBtn = `<button class="chip-btn signin" data-action="sign-in" data-loc-id="${loc.id}" data-ws-id="${ws.id}" data-occupant="">Sign in</button>`;
              }

              return `
                <div class="ws-row">
                  <div class="ws-meta">
                    <div class="ws-label">${escapeHtml(ws.label)}</div>
                    <div class="ws-person ${occupantName ? "" : "empty"}">${
                      occupantName ? escapeHtml(occupantName) + (isMe ? '<span class="you-tag">(you)</span>' : "") : "Unassigned"
                    }</div>
                  </div>
                  <div class="ws-actions">
                    <span class="ext-tag">${escapeHtml(ws.extension)}</span>
                    ${actionBtn}
                  </div>
                </div>
              `;
            }).join("") || `<div class="ws-row"><div class="ws-person empty">No workstations set up</div></div>`}
          </div>
        ` : ""}
      </div>
    `;
  }).join("");
}

function showToast(msg, ok) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (ok ? "ok" : "err");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function handleSignIn(locationId, workstationId, occupantName) {
  if (!currentStaffId) { showToast("Select your name up top first.", false); return; }
  if (occupantName) {
    const ok = confirm(`This will move ${occupantName} out of this workstation. Continue?`);
    if (!ok) return;
  }
  try {
    const res = await fetch(API_SCHEDULE, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ date: viewDate, shift: viewShift, staffId: currentStaffId, locationId, workstationId })
    });
    if (!res.ok) throw new Error(await res.text());
    schedule = await res.json();
    renderBoard();
    showToast("Signed in.", true);
  } catch (err) {
    showToast("Couldn't sign in — try again.", false);
  }
}

async function handleLeave() {
  if (!currentStaffId) return;
  try {
    const res = await fetch(API_SCHEDULE, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ date: viewDate, shift: viewShift, staffId: currentStaffId, locationId: null })
    });
    if (!res.ok) throw new Error(await res.text());
    schedule = await res.json();
    renderBoard();
    showToast("Left that workstation.", true);
  } catch (err) {
    showToast("Couldn't update — try again.", false);
  }
}

// ---- Event wiring ----

document.getElementById("prevDay").onclick = () => { viewDate = addDays(viewDate, -1); refreshDateUI(); loadSchedule(); };
document.getElementById("nextDay").onclick = () => { viewDate = addDays(viewDate, 1); refreshDateUI(); loadSchedule(); };
document.getElementById("todayBtn").onclick = () => { viewDate = todayStr(); refreshDateUI(); loadSchedule(); };

function refreshDateUI() {
  document.getElementById("dateLabel").textContent = formatDateLabel(viewDate);
}

document.querySelectorAll("#viewShiftSwitch button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#viewShiftSwitch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    viewShift = btn.dataset.val;
    renderBoard();
  };
});

const staffInput = document.getElementById("staffInput");
const staffDropdown = document.getElementById("staffDropdown");

staffInput.addEventListener("focus", showStaffDropdown);

staffInput.addEventListener("input", () => {
  staffFiltered = computeStaffFiltered(staffInput.value);
  staffHighlightIndex = staffFiltered.length ? 0 : -1;
  renderStaffDropdown();
  staffDropdown.classList.add("show");
});

staffInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (!staffFiltered.length) return;
    staffHighlightIndex = (staffHighlightIndex + 1) % staffFiltered.length;
    renderStaffDropdown();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (!staffFiltered.length) return;
    staffHighlightIndex = (staffHighlightIndex - 1 + staffFiltered.length) % staffFiltered.length;
    renderStaffDropdown();
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (staffHighlightIndex >= 0 && staffFiltered[staffHighlightIndex]) {
      commitStaffSelection(staffFiltered[staffHighlightIndex].id);
    } else if (staffFiltered.length === 1) {
      commitStaffSelection(staffFiltered[0].id);
    }
  } else if (e.key === "Escape") {
    revertStaffInput();
    hideStaffDropdown();
    staffInput.blur();
  }
});

// Use mousedown (not click) so this fires before the input's blur event,
// which would otherwise hide the dropdown before the selection registers.
staffDropdown.addEventListener("mousedown", (e) => {
  const opt = e.target.closest(".staff-option");
  if (!opt) return;
  e.preventDefault();
  commitStaffSelection(opt.dataset.staffId);
});

staffInput.addEventListener("blur", () => {
  setTimeout(() => {
    hideStaffDropdown();
    const val = staffInput.value.trim();
    if (val === "" && currentStaffId) {
      commitStaffSelection("");
    } else if (val !== (currentStaffId ? getStaffName(currentStaffId) : "")) {
      revertStaffInput();
    }
  }, 120);
});

document.getElementById("board").addEventListener("click", (e) => {
  const toggleBtn = e.target.closest('[data-action="toggle-loc"]');
  if (toggleBtn) {
    const locId = toggleBtn.closest(".loc-card").dataset.locId;
    if (expandedLocations.has(locId)) expandedLocations.delete(locId);
    else expandedLocations.add(locId);
    renderBoard();
    return;
  }

  const signInBtn = e.target.closest('[data-action="sign-in"]');
  if (signInBtn) {
    handleSignIn(signInBtn.dataset.locId, signInBtn.dataset.wsId, signInBtn.dataset.occupant || null);
    return;
  }

  const leaveBtn = e.target.closest('[data-action="leave"]');
  if (leaveBtn) {
    handleLeave();
    return;
  }
});

// ---- Init ----
refreshDateUI();

(async function init() {
  await loadConfig();
  await loadSchedule();
})();

setInterval(loadSchedule, REFRESH_MS);
</script>
</body>
</html>
