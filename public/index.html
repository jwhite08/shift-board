<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shift Board — Gastro Associates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E141C;
    --surface: #171F29;
    --surface-2: #1D2733;
    --line: #2A3644;
    --text: #F2F6F9;
    --text-soft: #8D98A6;
    --text-faint: #5C6773;
    --blue: #2E8FE0;
    --blue-bright: #5DAAF5;
    --blue-soft: rgba(46, 143, 224, 0.16);
    --blue-border: rgba(46, 143, 224, 0.4);
    --cyan: #22B8CE;
    --cyan-soft: rgba(34, 184, 206, 0.16);
    --cyan-border: rgba(34, 184, 206, 0.4);
    --danger: #E5565B;
    --danger-soft: rgba(229, 86, 91, 0.14);
    --radius: 14px;
    --shift-color: var(--blue);
    --shift-soft: var(--blue-soft);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body {
    background: radial-gradient(1100px 550px at 50% -8%, #1B2733 0%, #0E141C 55%);
    min-height: 100vh;
  }

  body[data-shift="PM"] {
    --shift-color: var(--cyan);
    --shift-soft: var(--cyan-soft);
  }

  h1, h2, h3 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    margin: 0;
  }

  button { font-family: inherit; }
  a { color: var(--blue-bright); }

  .topbar {
    background: rgba(23, 31, 41, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--blue-bright);
    text-shadow: 0 0 18px rgba(46, 143, 224, 0.35);
  }

  .brand span.tag {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 500;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-soft);
    flex-wrap: wrap;
  }

  /* Scoped to the arrow buttons only — do NOT use a generic ".date-nav button"
     selector here, or it will also resize/reshape the Today pill below. */
  .nav-arrow {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .nav-arrow:hover { background: var(--surface-2); border-color: var(--blue-border); }

  .date-label {
    font-weight: 600;
    color: var(--text);
    min-width: 150px;
    text-align: center;
    flex-shrink: 0;
  }

  .today-pill {
    border: 1px solid var(--blue-border);
    color: var(--blue-bright);
    background: var(--blue-soft);
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .today-pill:hover { background: var(--blue); color: #0E141C; }

  .shift-switch {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }

  .shift-switch button {
    border: none;
    background: transparent;
    padding: 7px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--text-soft);
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }

  .shift-switch button.active[data-val="AM"] {
    background: var(--blue);
    color: #0E141C;
  }
  .shift-switch button.active[data-val="PM"] {
    background: var(--cyan);
    color: #0E141C;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 18px;
    border-radius: 2px;
    background: var(--blue);
    display: inline-block;
    flex-shrink: 0;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .loc-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 8px;
    transition: border-color 0.15s;
  }
  .loc-card:hover { border-color: var(--blue-border); }

  .loc-card h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  .ws-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
  }
  .ws-row:last-child { border-bottom: none; }

  .ws-meta { min-width: 0; }

  .ws-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 500;
  }

  .ws-person {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ws-person.empty {
    color: var(--text-faint);
    font-weight: 500;
    font-style: italic;
  }

  .ext-tag {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: var(--blue-soft);
    color: var(--blue-bright);
    border: 1px solid var(--blue-border);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .ext-tag::before {
    content: "EXT";
    font-size: 8px;
    opacity: 0.65;
    margin-right: 5px;
    letter-spacing: 0.08em;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    color: var(--text-soft);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  .empty-state a { font-weight: 600; }

  /* Sidebar */
  .panel {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    position: sticky;
    top: 90px;
  }

  .panel h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .panel .sub {
    font-size: 12.5px;
    color: var(--text-soft);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 5px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }

  select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
  }
  select:disabled { opacity: 0.5; }

  .form-shift-toggle { display: flex; gap: 6px; }
  .form-shift-toggle button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-soft);
  }
  .form-shift-toggle button.active[data-val="AM"] {
    background: var(--blue-soft);
    border-color: var(--blue-border);
    color: var(--blue-bright);
  }
  .form-shift-toggle button.active[data-val="PM"] {
    background: var(--cyan-soft);
    border-color: var(--cyan-border);
    color: var(--cyan);
  }

  .ext-preview { margin-top: 8px; font-size: 12.5px; color: var(--text-soft); }
  .ext-preview strong { font-family: 'IBM Plex Mono', monospace; color: var(--text); }

  .btn-primary {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--shift-color);
    color: #F5F9FC;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-clear {
    width: 100%;
    margin-top: 8px;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-soft);
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
  }
  .btn-clear:hover { color: var(--danger); border-color: var(--danger); }

  .toast {
    margin-top: 12px;
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 6px;
    display: none;
  }
  .toast.show { display: block; }
  .toast.ok { background: var(--blue-soft); color: var(--blue-bright); }
  .toast.err { background: var(--danger-soft); color: var(--danger); }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 30px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Shift Board</h1>
      <span class="tag">Gastro Associates</span>
    </div>
    <div class="date-nav">
      <button id="prevDay" class="nav-arrow" title="Previous day">‹</button>
      <span class="date-label" id="dateLabel">—</span>
      <button id="nextDay" class="nav-arrow" title="Next day">›</button>
      <button class="today-pill" id="todayBtn">Today</button>
    </div>
    <div class="shift-switch" id="viewShiftSwitch">
      <button data-val="AM" class="active">AM</button>
      <button data-val="PM">PM</button>
    </div>
  </div>
</div>

<main>
  <div class="layout">
    <div>
      <div class="section-title" id="boardTitle">AM shift — who's where</div>
      <div class="board-grid" id="board">
        <div class="empty-state">Loading board…</div>
      </div>
    </div>

    <div class="panel">
      <h2>Set my location</h2>
      <div class="sub">Pick your name and where you're working. This updates the board for everyone right away.</div>

      <label for="staffSelect">Your name</label>
      <select id="staffSelect"></select>

      <label>Shift</label>
      <div class="form-shift-toggle" id="formShiftSwitch">
        <button data-val="AM" class="active">AM</button>
        <button data-val="PM">PM</button>
      </div>

      <label for="locationSelect">Office / location</label>
      <select id="locationSelect">
        <option value="">Select a location…</option>
      </select>

      <label for="workstationSelect">Workstation</label>
      <select id="workstationSelect" disabled>
        <option value="">Select a location first</option>
      </select>

      <div class="ext-preview" id="extPreview"></div>

      <button class="btn-primary" id="saveBtn" disabled>Save my location</button>
      <button class="btn-clear" id="clearBtn">I'm not working this shift</button>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div class="footer-note">Board refreshes automatically. Locations, extensions, and staff are managed from the <a href="/admin.html">admin page</a>.</div>
</main>

<script>
const API_CONFIG = "/api/config";
const API_SCHEDULE = "/api/schedule";
const REFRESH_MS = 30000;
const LAST_STAFF_KEY = "shiftboard:lastStaffId";

let config = { locations: [], staff: [] };
let schedule = { AM: {}, PM: {} };
let viewDate = todayStr();
let viewShift = (new Date().getHours() < 12) ? "AM" : "PM";
let formShift = viewShift;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const opts = { weekday: "short", month: "short", day: "numeric" };
  const label = d.toLocaleDateString(undefined, opts);
  return dateStr === todayStr() ? label + " (today)" : label;
}

async function loadConfig() {
  const res = await fetch(API_CONFIG);
  config = await res.json();
  populateStaffSelect();
  populateLocationSelect();
}

async function loadSchedule() {
  const res = await fetch(`${API_SCHEDULE}?date=${viewDate}`);
  schedule = await res.json();
  renderBoard();
}

function populateStaffSelect() {
  const sel = document.getElementById("staffSelect");
  const sorted = [...config.staff].sort((a,b) => a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">Select your name…</option>' +
    sorted.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");

  const last = localStorage.getItem(LAST_STAFF_KEY);
  if (last && config.staff.some(s => s.id === last)) {
    sel.value = last;
  }
  updateSaveEnabled();
}

function populateLocationSelect() {
  const sel = document.getElementById("locationSelect");
  sel.innerHTML = '<option value="">Select a location…</option>' +
    config.locations.map(l => `<option value="${l.id}">${escapeHtml(l.name)}</option>`).join("");
}

function populateWorkstationSelect(locationId) {
  const sel = document.getElementById("workstationSelect");
  const loc = config.locations.find(l => l.id === locationId);
  if (!loc) {
    sel.innerHTML = '<option value="">Select a location first</option>';
    sel.disabled = true;
    document.getElementById("extPreview").textContent = "";
    return;
  }
  sel.disabled = false;
  sel.innerHTML = '<option value="">Select a workstation…</option>' +
    loc.workstations.map(w => `<option value="${w.id}">${escapeHtml(w.label)} — ext ${escapeHtml(w.extension)}</option>`).join("");
  document.getElementById("extPreview").textContent = "";
}

function renderBoard() {
  const board = document.getElementById("board");
  document.getElementById("boardTitle").textContent = `${viewShift} shift — who's where`;

  if (!config.locations.length) {
    board.innerHTML = `<div class="empty-state">No locations have been set up yet. Add them from the <a href="/admin.html">admin page</a>.</div>`;
    return;
  }

  // Build workstationId -> staff name lookup for the active shift
  const shiftAssignments = schedule[viewShift] || {};
  const staffById = Object.fromEntries(config.staff.map(s => [s.id, s.name]));
  const wsToName = {};
  for (const [staffId, assign] of Object.entries(shiftAssignments)) {
    if (assign.workstationId) {
      wsToName[assign.workstationId] = staffById[staffId] || "Unknown staff";
    }
  }

  board.innerHTML = config.locations.map(loc => `
    <div class="loc-card">
      <h3>${escapeHtml(loc.name)}</h3>
      ${loc.workstations.map(ws => {
        const name = wsToName[ws.id];
        return `
          <div class="ws-row">
            <div class="ws-meta">
              <div class="ws-label">${escapeHtml(ws.label)}</div>
              <div class="ws-person ${name ? "" : "empty"}">${name ? escapeHtml(name) : "Unassigned"}</div>
            </div>
            <div class="ext-tag">${escapeHtml(ws.extension)}</div>
          </div>
        `;
      }).join("") || `<div class="ws-row"><div class="ws-person empty">No workstations set up</div></div>`}
    </div>
  `).join("");
}

function updateSaveEnabled() {
  const staffId = document.getElementById("staffSelect").value;
  const wsId = document.getElementById("workstationSelect").value;
  document.getElementById("saveBtn").disabled = !(staffId && wsId);
}

function showToast(msg, ok) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (ok ? "ok" : "err");
  setTimeout(() => t.classList.remove("show"), 3500);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// ---- Event wiring ----

document.getElementById("prevDay").onclick = () => { viewDate = addDays(viewDate, -1); refreshDateUI(); loadSchedule(); };
document.getElementById("nextDay").onclick = () => { viewDate = addDays(viewDate, 1); refreshDateUI(); loadSchedule(); };
document.getElementById("todayBtn").onclick = () => { viewDate = todayStr(); refreshDateUI(); loadSchedule(); };

function refreshDateUI() {
  document.getElementById("dateLabel").textContent = formatDateLabel(viewDate);
}

document.querySelectorAll("#viewShiftSwitch button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#viewShiftSwitch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    viewShift = btn.dataset.val;
    document.body.dataset.shift = viewShift;
    renderBoard();
  };
});

document.querySelectorAll("#formShiftSwitch button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#formShiftSwitch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    formShift = btn.dataset.val;
  };
});

document.getElementById("staffSelect").onchange = updateSaveEnabled;

document.getElementById("locationSelect").onchange = (e) => {
  populateWorkstationSelect(e.target.value);
  updateSaveEnabled();
};

document.getElementById("workstationSelect").onchange = (e) => {
  const locId = document.getElementById("locationSelect").value;
  const loc = config.locations.find(l => l.id === locId);
  const ws = loc && loc.workstations.find(w => w.id === e.target.value);
  document.getElementById("extPreview").innerHTML = ws
    ? `Extension: <strong>${escapeHtml(ws.extension)}</strong>`
    : "";
  updateSaveEnabled();
};

document.getElementById("saveBtn").onclick = async () => {
  const staffId = document.getElementById("staffSelect").value;
  const locationId = document.getElementById("locationSelect").value;
  const workstationId = document.getElementById("workstationSelect").value;
  if (!staffId || !locationId || !workstationId) return;

  localStorage.setItem(LAST_STAFF_KEY, staffId);

  try {
    const res = await fetch(API_SCHEDULE, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ date: viewDate, shift: formShift, staffId, locationId, workstationId })
    });
    if (!res.ok) throw new Error(await res.text());
    schedule = await res.json();
    if (formShift === viewShift) renderBoard();
    showToast("Saved. The board is updated.", true);
  } catch (err) {
    showToast("Couldn't save — try again.", false);
  }
};

document.getElementById("clearBtn").onclick = async () => {
  const staffId = document.getElementById("staffSelect").value;
  if (!staffId) { showToast("Select your name first.", false); return; }
  try {
    const res = await fetch(API_SCHEDULE, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ date: viewDate, shift: formShift, staffId, locationId: null })
    });
    if (!res.ok) throw new Error(await res.text());
    schedule = await res.json();
    if (formShift === viewShift) renderBoard();
    showToast("Cleared your assignment for that shift.", true);
  } catch (err) {
    showToast("Couldn't clear — try again.", false);
  }
};

// ---- Init ----
document.body.dataset.shift = viewShift;
document.querySelectorAll("#viewShiftSwitch button").forEach(b => b.classList.toggle("active", b.dataset.val === viewShift));
document.querySelectorAll("#formShiftSwitch button").forEach(b => b.classList.toggle("active", b.dataset.val === formShift));
refreshDateUI();

(async function init() {
  await loadConfig();
  await loadSchedule();
})();

setInterval(loadSchedule, REFRESH_MS);
</script>
</body>
</html>
